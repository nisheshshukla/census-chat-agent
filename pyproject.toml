[project]
name = "census-agent"
version = "0.1.0"
description = "Chat agent grounded in the US Open Census dataset on Snowflake"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=1.0",
    "snowflake-connector-python>=3.13",
    "cryptography>=43",
    "sqlglot>=25",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
census-agent = "census_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["census_agent*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "SIM115"]
"tests/*" = ["E501"]
"census_agent/agent/prompts.py" = ["E501"]
"census_agent/guardrails/classifier.py" = ["E501"]
"census_agent/guardrails/judge.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["census_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real Snowflake/Anthropic; needs credentials"]
